<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, height=282, initial-scale=1, user-scalable=no">
<title>S&amp;C Console</title>
<style>
  :root {
    --red: #EB0C00;
    --bg: #0B0B0B;
    --card: #161616;
    --line: #262626;
    --text: #F4F4F4;
    --muted: #8A8A8A;
    --ok: #3DDC84;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 240px; height: 282px; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Roboto, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }

  /* Top bar */
  .bar {
    height: 30px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .brand { font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .brand b { color: var(--red); }
  .status { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--red); }

  /* Cards */
  .deck { position: relative; flex: 1; overflow: hidden; }
  .card {
    position: absolute; inset: 10px 10px 8px; background: var(--card); border-radius: 14px;
    padding: 12px 14px; display: flex; flex-direction: column;
    transition: transform .22s ease, opacity .22s ease; will-change: transform, opacity;
  }
  .card .label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
  .card .big { font-size: 34px; font-weight: 800; line-height: 1.05; margin-top: 8px; letter-spacing: -.01em; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .card ul { list-style: none; margin-top: 10px; overflow: hidden; }
  .card li { font-size: 12px; line-height: 1.35; padding: 4px 0; border-top: 1px solid var(--line);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card li:first-child { border-top: 0; }
  .pager { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; }
  .pager i { width: 3px; height: 10px; border-radius: 2px; background: var(--line); display: block; }
  .pager i.on { background: var(--red); }

  .hint { height: 26px; flex: none; font-size: 10px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .hint kbd { font-family: inherit; color: var(--text); background: var(--line); border-radius: 4px; padding: 1px 5px; }

  /* Listening / thinking */
  #listen { align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .orb { width: 92px; height: 92px; border-radius: 50%; background: var(--red);
         box-shadow: 0 0 0 0 rgba(235,12,0,.6); animation: pulse 1.2s ease-out infinite; }
  .orb.think { background: transparent; border: 4px solid var(--line); border-top-color: var(--red);
               box-shadow: none; animation: spin .8s linear infinite; }
  @keyframes pulse { to { box-shadow: 0 0 0 26px rgba(235,12,0,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #listenText { margin-top: 18px; font-size: 14px; font-weight: 700; }
  #listenSub { margin-top: 4px; font-size: 11px; color: var(--muted); }

  /* Answer */
  #answer .q { padding: 10px 12px 0; font-size: 11px; color: var(--muted); font-style: italic;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
  #answerBody { flex: 1; overflow: hidden; padding: 6px 12px 0; }
  #answerText { font-size: 15px; line-height: 1.4; transition: transform .18s ease; will-change: transform; }

  /* PIN */
  #pin { align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #pin h1 { font-size: 15px; font-weight: 800; }
  #pin p { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .digits { display: flex; gap: 10px; margin-top: 18px; }
  .digit { width: 38px; height: 50px; border-radius: 10px; background: var(--card); border: 2px solid var(--line);
           display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; }
  .digit.cur { border-color: var(--red); }
  .digit.done { color: var(--muted); }
  #pinMsg { margin-top: 14px; font-size: 11px; min-height: 14px; color: var(--red); }

  /* Message */
  #msg { align-items: center; justify-content: center; text-align: center; padding: 22px; }
  #msgTitle { font-size: 15px; font-weight: 800; }
  #msgBody { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>

<!-- Cards -->
<section class="screen" id="home">
  <div class="bar">
    <div class="brand">Straight <b>&amp;</b> Curly</div>
    <div class="status"><span class="dot" id="dot"></span><span id="updated">—</span></div>
  </div>
  <div class="deck" id="deck"></div>
  <div class="hint"><kbd>Hold</kbd> ask Claude · <kbd>Wheel</kbd> browse</div>
</section>

<!-- Listening / thinking -->
<section class="screen" id="listen">
  <div class="orb" id="orb"></div>
  <div id="listenText">Listening…</div>
  <div id="listenSub">Release to send</div>
</section>

<!-- Answer -->
<section class="screen" id="answer">
  <div class="q" id="answerQ"></div>
  <div id="answerBody"><div id="answerText"></div></div>
  <div class="hint"><kbd>Wheel</kbd> scroll · <kbd>Click</kbd> back</div>
</section>

<!-- PIN -->
<section class="screen" id="pin">
  <h1>Enter your PIN</h1>
  <p>Wheel to change · click for next</p>
  <div class="digits" id="digits"></div>
  <div id="pinMsg"></div>
</section>

<!-- Message -->
<section class="screen" id="msg">
  <div id="msgTitle"></div>
  <div id="msgBody"></div>
</section>

<script>
(() => {
  "use strict";

  // ---------- Storage (R1 creationStorage when present, browser storage otherwise) ----------
  const store = {
    async get(key, secure) {
      try {
        const s = window.creationStorage && (secure ? window.creationStorage.secure : window.creationStorage.plain);
        if (s) { const v = await s.getItem(key); return v ? atob(v) : null; }
      } catch (e) {}
      try { return localStorage.getItem("snc_" + key); } catch (e) { return null; }
    },
    async set(key, value, secure) {
      try {
        const s = window.creationStorage && (secure ? window.creationStorage.secure : window.creationStorage.plain);
        if (s) { await s.setItem(key, btoa(value)); return; }
      } catch (e) {}
      try { localStorage.setItem("snc_" + key, value); } catch (e) {}
    },
    async del(key, secure) {
      try {
        const s = window.creationStorage && (secure ? window.creationStorage.secure : window.creationStorage.plain);
        if (s) { await s.removeItem(key); return; }
      } catch (e) {}
      try { localStorage.removeItem("snc_" + key); } catch (e) {}
    }
  };

  // ---------- State ----------
  let api = null;          // brain URL, e.g. https://name.ngrok-free.app
  let token = null;        // issued by the brain after PIN pairing
  let screen = "msg";
  let cards = [];
  let idx = 0;
  let pin = [0, 0, 0, 0], pinPos = 0;
  let answerOffset = 0;
  let recorder = null, chunks = [], micStream = null, recording = false;
  let refreshTimer = null;

  const $ = (id) => document.getElementById(id);

  function show(name) {
    screen = name;
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === name));
  }
  function message(title, body) { $("msgTitle").textContent = title; $("msgBody").textContent = body || ""; show("msg"); }

  // ---------- Network ----------
  async function call(path, opts = {}) {
    const headers = Object.assign({ "ngrok-skip-browser-warning": "1" }, opts.headers || {});
    if (token) headers.Authorization = "Bearer " + token;
    const res = await fetch(api + path, Object.assign({}, opts, { headers }));
    if (res.status === 401) { await store.del("token", true); token = null; startPin("Session ended. Enter your PIN again."); throw new Error("unauthorised"); }
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  // ---------- Cards ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function renderCards() {
    const deck = $("deck");
    if (!cards.length) { deck.innerHTML = '<div class="card"><div class="label">Getting ready</div><div class="sub" style="margin-top:8px">Your Mac is gathering the first update. This can take a minute.</div></div>'; return; }
    deck.innerHTML = cards.map((c) => `
      <div class="card">
        <div class="label">${esc(c.title)}</div>
        ${c.big ? `<div class="big">${esc(c.big)}</div>` : ""}
        ${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ""}
        ${c.lines && c.lines.length ? `<ul>${c.lines.slice(0, 5).map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
      </div>`).join("") + `<div class="pager">${cards.map(() => "<i></i>").join("")}</div>`;
    positionCards();
  }

  function positionCards() {
    const els = $("deck").querySelectorAll(".card");
    els.forEach((el, i) => {
      const d = i - idx;
      el.style.transform = `translateY(${d * 105}%) scale(${d === 0 ? 1 : 0.94})`;
      el.style.opacity = d === 0 ? 1 : 0;
    });
    $("deck").querySelectorAll(".pager i").forEach((p, i) => p.classList.toggle("on", i === idx));
  }

  async function refresh() {
    try {
      const data = await call("/cards");
      cards = Array.isArray(data.cards) ? data.cards : [];
      if (idx >= cards.length) idx = 0;
      $("dot").className = "dot ok";
      $("updated").textContent = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" }) : "—";
      if (screen === "home") renderCards();
    } catch (e) {
      if (e.message === "unauthorised") return;
      $("dot").className = "dot err";
      $("updated").textContent = "Mac offline";
    }
  }

  function goHome() {
    show("home");
    renderCards();
    refresh();
    clearInterval(refreshTimer);
    refreshTimer = setInterval(refresh, 60000);
  }

  // ---------- PIN pairing ----------
  function renderPin() {
    $("digits").innerHTML = pin.map((d, i) =>
      `<div class="digit ${i === pinPos ? "cur" : ""} ${i < pinPos ? "done" : ""}">${i < pinPos ? "•" : d}</div>`).join("");
  }
  function startPin(msg) { pin = [0, 0, 0, 0]; pinPos = 0; $("pinMsg").textContent = msg || ""; renderPin(); show("pin"); }

  async function submitPin() {
    $("pinMsg").textContent = "Checking…";
    try {
      const res = await fetch(api + "/pair", {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
        body: JSON.stringify({ pin: pin.join("") })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.token) { startPin(data.error || "That PIN didn't work."); return; }
      token = data.token;
      await store.set("token", token, true);
      goHome();
    } catch (e) {
      startPin("Can't reach your Mac.");
    }
  }

  // ---------- Voice ----------
  async function startListening() {
    if (recording || !token) return;
    recording = true;
    $("orb").className = "orb"; $("listenText").textContent = "Listening…"; $("listenSub").textContent = "Release to send";
    show("listen");
    try {
      micStream = micStream || await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      recorder = new MediaRecorder(micStream);
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = sendAudio;
      recorder.start();
    } catch (e) {
      recording = false;
      message("Microphone unavailable", "Allow microphone access for this creation, then try again.");
      setTimeout(goHome, 2500);
    }
  }

  function stopListening() {
    if (!recording) return;
    recording = false;
    if (recorder && recorder.state !== "inactive") recorder.stop();
  }

  async function sendAudio() {
    $("orb").className = "orb think"; $("listenText").textContent = "Thinking…"; $("listenSub").textContent = "Your Mac is checking";
    const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || "audio/webm" });
    if (blob.size < 2000) { goHome(); return; }
    try {
      const data = await call("/ask", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      showAnswer(data.transcript, data.answer || "No answer came back.");
    } catch (e) {
      if (e.message === "unauthorised") return;
      showAnswer("", "I couldn't reach your Mac. Check it's awake and the brain is running.");
    }
  }

  function showAnswer(q, a) {
    $("answerQ").textContent = q ? "“" + q + "”" : "";
    $("answerText").textContent = a;
    answerOffset = 0; $("answerText").style.transform = "translateY(0)";
    show("answer");
    try {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(a);
        u.lang = "en-AU";
        speechSynthesis.speak(u);
      }
    } catch (e) {}
  }

  function scrollAnswer(dir) {
    const body = $("answerBody"), text = $("answerText");
    const max = Math.max(0, text.scrollHeight - body.clientHeight + 8);
    answerOffset = Math.min(max, Math.max(0, answerOffset + dir * 40));
    text.style.transform = `translateY(${-answerOffset}px)`;
  }

  // ---------- Hardware events ----------
  function onWheel(dir) {
    if (screen === "home" && cards.length) { idx = (idx + dir + cards.length) % cards.length; positionCards(); }
    else if (screen === "pin") { pin[pinPos] = (pin[pinPos] + (dir > 0 ? 1 : 9)) % 10; renderPin(); }
    else if (screen === "answer") scrollAnswer(dir);
  }
  function onClick() {
    if (screen === "pin") { pinPos++; if (pinPos >= 4) { renderPin(); submitPin(); } else renderPin(); }
    else if (screen === "answer") { try { speechSynthesis.cancel(); } catch (e) {} goHome(); }
    else if (screen === "home") refresh();
  }

  window.addEventListener("scrollDown", () => onWheel(1));
  window.addEventListener("scrollUp", () => onWheel(-1));
  window.addEventListener("sideClick", onClick);
  window.addEventListener("longPressStart", startListening);
  window.addEventListener("longPressEnd", stopListening);

  // Keyboard fallback for testing in a desktop browser:
  // Arrow keys = wheel, Enter = side click, hold Space = hold side button.
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") onWheel(1);
    else if (e.key === "ArrowUp") onWheel(-1);
    else if (e.key === "Enter") onClick();
    else if (e.key === " " && !e.repeat) startListening();
  });
  window.addEventListener("keyup", (e) => { if (e.key === " ") stopListening(); });

  // ---------- Boot ----------
  (async function boot() {
    const fromUrl = new URLSearchParams(location.search).get("api");
    if (fromUrl) { api = fromUrl.replace(/\/+$/, ""); await store.set("api", api); }
    else api = await store.get("api");

    if (!api) { message("Not set up yet", "Install this creation from the QR code your Mac shows, so it knows where to connect."); return; }

    token = await store.get("token", true);
    if (!token) { startPin(); return; }
    goHome();
  })();
})();
</script>
</body>
</html>
